<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="#0d1117"/>

  <!-- Book body left page -->
  <path d="M120 148 L120 364 Q120 376 132 380 L248 400 L248 148 Q200 136 132 136 Q120 136 120 148 Z" fill="#1a2332" stroke="#10b981" stroke-width="4"/>

  <!-- Book body right page -->
  <path d="M264 148 L264 400 L380 380 Q392 376 392 364 L392 148 Q392 136 380 136 Q312 136 264 148 Z" fill="#1e2d3d" stroke="#10b981" stroke-width="4"/>

  <!-- Book spine center -->
  <rect x="246" y="128" width="20" height="276" rx="4" fill="#10b981"/>

  <!-- Left page lines (text simulation) -->
  <line x1="145" y1="195" x2="235" y2="192" stroke="#2d4a3e" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="215" x2="235" y2="213" stroke="#2d4a3e" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="235" x2="225" y2="234" stroke="#2d4a3e" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="265" x2="235" y2="263" stroke="#2d4a3e" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="285" x2="230" y2="284" stroke="#2d4a3e" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="305" x2="235" y2="304" stroke="#2d4a3e" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="325" x2="210" y2="324" stroke="#2d4a3e" stroke-width="4" stroke-linecap="round"/>

  <!-- Right page lines -->
  <line x1="277" y1="192" x2="368" y2="195" stroke="#1f3a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="213" x2="368" y2="215" stroke="#1f3a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="234" x2="355" y2="235" stroke="#1f3a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="263" x2="368" y2="265" stroke="#1f3a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="284" x2="360" y2="285" stroke="#1f3a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="304" x2="368" y2="305" stroke="#1f3a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="324" x2="345" y2="325" stroke="#1f3a2e" stroke-width="4" stroke-linecap="round"/>

  <!-- Gear icon bottom-right corner -->
  <g transform="translate(348, 338)">
    <!-- Gear background circle -->
    <circle cx="60" cy="60" r="66" fill="#0d1117"/>
    <!-- Gear teeth + body -->
    <g fill="#f59e0b">
      <!-- Gear body -->
      <circle cx="60" cy="60" r="32" fill="#f59e0b"/>
      <!-- Gear hole -->
      <circle cx="60" cy="60" r="13" fill="#0d1117"/>
      <!-- 8 teeth -->
      <rect x="52" y="20" width="16" height="18" rx="4" fill="#f59e0b"/>
      <rect x="52" y="82" width="16" height="18" rx="4" fill="#f59e0b"/>
      <rect x="20" y="52" width="18" height="16" rx="4" fill="#f59e0b"/>
      <rect x="82" y="52" width="18" height="16" rx="4" fill="#f59e0b"/>
      <rect x="29.4" y="29.4" width="16" height="18" rx="4" fill="#f59e0b" transform="rotate(45 37.4 38.4)"/>
      <rect x="74.4" y="29.4" width="16" height="18" rx="4" fill="#f59e0b" transform="rotate(45 82.4 38.4)"/>
      <rect x="29.4" y="72.6" width="16" height="18" rx="4" fill="#f59e0b" transform="rotate(-45 37.4 81.6)"/>
      <rect x="74.4" y="72.6" width="16" height="18" rx="4" fill="#f59e0b" transform="rotate(-45 82.4 81.6)"/>
    </g>
  </g>

  <!-- Subtle emerald glow/accent at top -->
  <ellipse cx="256" cy="125" rx="80" ry="8" fill="#10b981" opacity="0.3"/>
</svg>